<svg xmlns="http://www.w3.org/2000/svg" width="600" height="867" viewBox="0 0 450 650" preserveAspectRatio="xMinYMin meet">
  <defs>
    <!-- brushed dark steel-teal plate -->
    <filter id="plateB" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.42" numOctaves="4" seed="6" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#33555f" surfaceScale="1.7" diffuseConstant="1.25" result="d">
        <feDistantLight azimuth="235" elevation="52"/>
      </feDiffuseLighting>
    </filter>
    <!-- raised-metal emboss for the device -->
    <filter id="embossB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4.5" specularConstant="0.85" specularExponent="13"
                          lighting-color="#dcefea" result="spec">
        <feDistantLight azimuth="235" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specClip"/>
      </feMerge>
    </filter>
    <radialGradient id="glowB" cx="50%" cy="36%" r="60%">
      <stop offset="0%"   stop-color="#6f9aa2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6f9aa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="20%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="edgeB" cx="50%" cy="42%" r="62%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- plate + depth glow -->
  <rect width="450" height="650" fill="#0c1a20"/>
  <rect width="450" height="650" filter="url(#plateB)" opacity="0.92"/>
  <rect width="450" height="650" fill="url(#glowB)"/>

  <!-- embossed sword device (subtle, raised in the steel) -->
  <g transform="translate(225 0)" filter="url(#embossB)" opacity="0.55">
    <g fill="#243a40">
      <!-- main wide crossbar, swept tips -->
      <polygon points="-112,150 112,150 96,168 -96,168"/>
      <polygon points="-112,150 -96,168 -118,180 -134,160"/>
      <polygon points="112,150 96,168 118,180 134,160"/>
      <!-- grip -->
      <rect x="-9" y="166" width="18" height="32"/>
      <!-- second smaller crossbar -->
      <polygon points="-66,196 66,196 54,212 -54,212"/>
      <!-- blade -->
      <polygon points="-25,212 25,212 21,330 27,362 18,470 0,508 -18,470 -27,362 -21,330"/>
    </g>
  </g>

  <!-- scratches -->
  <g>
    <line x1="30"  y1="250" x2="200" y2="210" stroke="#cfe6e2" stroke-width="0.6" opacity="0.16"/>
    <line x1="280" y1="120" x2="430" y2="158" stroke="#06100f" stroke-width="0.7" opacity="0.3"/>
    <line x1="60"  y1="570" x2="220" y2="525" stroke="#cfe6e2" stroke-width="0.5" opacity="0.12"/>
    <line x1="250" y1="610" x2="420" y2="565" stroke="#06100f" stroke-width="0.7" opacity="0.28"/>
    <line x1="70"  y1="90"  x2="150" y2="72"  stroke="#cfe6e2" stroke-width="0.5" opacity="0.12"/>
    <line x1="320" y1="440" x2="415" y2="412" stroke="#06100f" stroke-width="0.6" opacity="0.25"/>
  </g>

  <!-- vignettes + teal frame -->
  <rect width="450" height="650" fill="url(#edgeB)"/>
  <rect width="450" height="650" fill="url(#vignB)"/>
  <rect x="9" y="9" width="432" height="632" rx="6" fill="none" stroke="#7fe3db" stroke-width="1" stroke-opacity="0.34"/>
</svg>
